    function hashString(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = Math.imul(31, hash) + str.charCodeAt(i) | 0;
      }
      return Math.abs(hash);
    }

    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function generateForm(rand) {
      const f = [];
      for (let i = 0; i < 5; i++) {
        const r = rand();
        if (r < 0.5) f.push('W');
        else if (r < 0.75) f.push('D');
        else f.push('L');
      }
      return f;
    }

    function calcFormScore(form) {
      return form.reduce((acc, val) => acc + (val === 'W' ? 2 : val === 'D' ? 0.5 : -1.5), 0);
    }

    function generate40Matches(dateStr) {
      const seed = hashString(dateStr);
      const rand = mulberry32(seed);
      const matches = [];

      for (let i = 0; i < 40; i++) {
        const league = LEAGUES[Math.floor(rand() * LEAGUES.length)];
        const teamPool = TEAMS_BY_LEAGUE[league];
        const homeIdx = Math.floor(rand() * teamPool.length);
        let awayIdx = Math.floor(rand() * (teamPool.length - 1));
        if (awayIdx >= homeIdx) awayIdx += 1;

        const home = teamPool[homeIdx];
        const away = teamPool[awayIdx];
        const hour = 11 + Math.floor(rand() * 11);
        const minute = [0, 15, 30, 45][Math.floor(rand() * 4)];
        const timeStr = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;

        const formHome = generateForm(rand);
        const formAway = generateForm(rand);

        const hasInjury = rand() < 0.32;
        const injury = hasInjury
          ? {
              team: rand() < 0.5 ? home : away,
              player: STAR_PLAYERS[Math.floor(rand() * STAR_PLAYERS.length)],
              impact: 15
            }
          : null;

        const h2h = H2H_PATTERNS[Math.floor(rand() * H2H_PATTERNS.length)];
        const market = MARKETS[Math.floor(rand() * MARKETS.length)];
        const odds = parseFloat((1.25 + rand() * 0.45).toFixed(2));

        const formScore = calcFormScore(formHome) + calcFormScore(formAway) * 0.5;
        const h2hBoost = h2h.startsWith('4/4') || h2h.startsWith('5/5') ? 10 : h2h.startsWith('3/3') ? 6 : 3;
        const injuryPenalty = injury ? 15 : 0;
        let confidence = Math.round(65 + formScore * 2 + h2hBoost - injuryPenalty);
        confidence = Math.max(58, Math.min(94, confidence));

        const why = WHY_TEMPLATES[Math.floor(rand() * WHY_TEMPLATES.length)]
          .replace('{home}', home)
          .replace('{away}', away)
          .replace('{h2h}', h2h)
          .replace('{market}', market)
          .replace('{form}', formHome.join(''))
          .replace('{formAway}', formAway.join(''))
          .replace('{injuryText}', injury ? `${injury.player} out` : 'no major injury');

        matches.push({
          id: `${dateStr}-${i}`,
          date: dateStr,
          league,
          time: timeStr,
          home,
          away,
          formHome,
          formAway,
          injury,
          h2h,
          market,
          odds,
          confidence,
          why,
          status: 'pending',
          finalScore: null,
          result: null
        });
      }
      return matches;
    }

    function calcResult(market, scoreStr) {
      if (!scoreStr || !scoreStr.includes('-')) return null;
      const parts = scoreStr.split('-').map((s) => parseInt(s.trim(), 10));
      if (parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
      const [home, away] = parts;
      const totalGoals = home + away;

      switch (market) {
        case 'Over 1.5': return totalGoals > 1.5 ? 'won' : 'lost';
        case 'Over 0.5': return totalGoals > 0.5 ? 'won' : 'lost';
        case '1X': return home >= away ? 'won' : 'lost';
        case 'Double Chance': return home !== away || home >= 0 ? 'won' : 'lost';
        case 'BTTS': return home > 0 && away > 0 ? 'won' : 'lost';
        default: return null;
      }
    }

    function getSimulatedScore(market, rand, confidence) {
      const winBias = rand() < 0.70 + confidence / 500;
      if (market === 'Over 1.5') {
        return winBias ? ['2-1', '2-0', '1-2', '3-1', '2-2', '3-0', '1-1'][Math.floor(rand() * 7)] : ['0-0', '1-0', '0-1'][Math.floor(rand() * 3)];
      }
      if (market === 'Over 0.5') {
        return winBias ? ['1-0', '1-1', '2-0', '2-1', '0-1'][Math.floor(rand() * 5)] : '0-0';
      }
      if (market === '1X') {
        return winBias ? ['2-0', '1-0', '1-1', '2-1', '2-2'][Math.floor(rand() * 5)] : ['0-1', '1-2', '0-2'][Math.floor(rand() * 3)];
      }
      if (market === 'BTTS') {
        return winBias ? ['1-1', '2-1', '1-2', '2-2', '3-1'][Math.floor(rand() * 5)] : ['2-0', '1-0', '0-1', '0-0'][Math.floor(rand() * 4)];
      }
      return winBias ? ['1-0', '1-1', '2-0', '2-1'][Math.floor(rand() * 4)] : ['0-1', '1-2', '0-2'][Math.floor(rand() * 3)];
    }

    function findCombo(matches, legCount, minOdds, maxOdds, favTeams = []) {
      if (!matches || matches.length < legCount) return null;
      const sorted = [...matches].sort((a, b) => {
        const aFav = favTeams.includes(a.home) || favTeams.includes(a.away) ? 1 : 0;
        const bFav = favTeams.includes(b.home) || favTeams.includes(b.away) ? 1 : 0;
        if (aFav !== bFav) return bFav - aFav;
        return b.confidence - a.confidence;
      });

      for (let i = 0; i <= sorted.length - legCount; i++) {
        const slice = sorted.slice(i, i + legCount);
        const totalOdds = slice.reduce((acc, m) => acc * m.odds, 1);
        if (totalOdds >= minOdds && totalOdds <= maxOdds) {
          return { legs: slice, total: parseFloat(totalOdds.toFixed(2)) };
        }
      }

      const n = sorted.length;
      function* combinations(k) {
        const indices = Array.from({ length: k }, (_, i) => i);
        while (indices[0] <= n - k) {
          yield indices.map((i) => sorted[i]);
          let i = k - 1;
          while (i >= 0 && indices[i] === n - k + i) i--;
          if (i < 0) break;
          indices[i]++;
          for (let j = i + 1; j < k; j++) indices[j] = indices[j - 1] + 1;
        }
      }

      let bestNear = null;
      let minDiff = Infinity;
      const targetMid = (minOdds + maxOdds) / 2;

      for (const combo of combinations(legCount)) {
        const totalOdds = combo.reduce((acc, m) => acc * m.odds, 1);
        if (totalOdds >= minOdds && totalOdds <= maxOdds) {
          return { legs: combo, total: parseFloat(totalOdds.toFixed(2)) };
        }
        const diff = Math.abs(totalOdds - targetMid);
        if (diff < minDiff) {
          minDiff = diff;
          bestNear = { legs: combo, total: parseFloat(totalOdds.toFixed(2)) };
        }
      }
      return bestNear;
    }

          const rand = mulberry32(hashString(d));

            const sc = getSimulatedScore(m.market, rand, m.confidence);
            return {
              ...m,
              status: 'finished',
              finalScore: sc,
              result: calcResult(m.market, sc)
            };
          });
          const wonCount = pastMatches.filter((m) => m.result === 'won').length;
          const accuracy = Math.round((wonCount / pastMatches.length) * 100);
          hist.push({ date: d, matches: pastMatches, accuracy, wonCount, total: pastMatches.length });

            let changed = false;
            const updated = prev.map((m) => {
              if (m.isManual || m.status === 'finished') return m;
              const [hStr, mStr] = m.time.split(':');
              const matchMin = parseInt(hStr, 10) * 60 + parseInt(mStr, 10);
              const now = new Date();
              const currentMin = now.getHours() * 60 + now.getMinutes();

              if (currentMin >= matchMin && currentMin < matchMin + 90) {
                const liveMin = Math.min(90, Math.max(1, currentMin - matchMin));
                changed = true;
                return { ...m, status: 'live', liveMinute: `${liveMin}'` };
              } else if (currentMin >= matchMin + 90) {
                const rand = mulberry32(hashString(m.id));
                const finalScore = getSimulatedScore(m.market, rand, m.confidence);
                changed = true;
                return {
                  ...m,
                  status: 'finished',
                  liveMinute: undefined,
                  finalScore,
                  result: calcResult(m.market, finalScore)
                };
              }
              return m;
            });

            if (changed) {
              localStorage.setItem('piposcores_matches', JSON.stringify(updated));
            }
            return changed ? updated : prev;

        return () => clearInterval(interval);

            h('div', { className: 'flex items-center gap-1 justify-end' },
              h('span', { className: 'text-[10px] px-2 py-0.5 rounded-full bg-[#00C82A]/15 text-[#00C82A] font-bold' }, m.market),
              h('span', { className: 'text-xs font-bold text-white bg-white/10 px-1.5 py-0.5 rounded' }, m.odds.toFixed(2))
            ),
            h('div', { className: 'text-[10px] text-zinc-400 mt-1' }, `${m.confidence}% conf`),
            m.finalScore && h('div', { className: 'text-xs font-bold text-white mt-1' }, `FT ${m.finalScore}`)
          )
        )
      );
    }

    // TICKET CARD SUBCOMPONENT
    function TicketCard({ title, badge, combo, onCopy, onShare }) {
      return h('div', { className: 'bg-[#151B25] rounded-[18px] p-4 border border-white/[0.06] shadow-[0_8px_32px_rgba(0,0,0,0.4)]' },
        h('div', { className: 'flex justify-between items-center mb-3' },
          h('div', { className: 'flex items-center gap-2' },
            h('span', { className: 'w-7 h-7 rounded-full bg-[#00C82A] flex items-center justify-center text-black font-black text-xs' }, '⚽'),
            h('span', { className: 'text-white font-bold text-sm' }, title),
            badge && h('span', { className: 'text-[10px] px-2 py-0.5 rounded-full bg-[#00C82A] text-black font-bold' }, badge)
          ),
          h('div', { className: 'text-[11px] text-zinc-400' }, 'Total Odds: ', h('span', { className: 'text-white font-bold text-[14px]' }, combo.total.toFixed(2)))
        ),
        h('div', { className: 'space-y-2.5' },
          combo.legs.map((m) => h(MatchRow, { key: m.id, m }))
        ),
        h('div', { className: 'flex gap-2 mt-4' },
          h('button', {
            onClick: onCopy,
            className: 'flex-1 h-10 rounded-full bg-white text-black font-bold text-sm'
          }, 'Copy Ticket'),
          h('button', {
            onClick: onShare,
            className: 'flex-1 h-10 rounded-full bg-[#00C82A] text-black font-bold text-sm'
          }, 'Share')
        )
      );
    }

    function StatusBadge({ status, result, liveMinute }) {
      if (status === 'finished') {
        return h('span', {
          className: `text-[10px] px-2 py-0.5 rounded-full font-bold ${result === 'won' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}`
        }, result === 'won' ? 'WON' : 'LOST');
      }
      if (status === 'live') {
        return h('span', { className: 'text-[10px] px-2 py-0.5 rounded-full bg-red-500 text-white font-bold animate-pulse' }, `LIVE ${liveMinute || ''}`);
      }
      return h('span', { className: 'text-[10px] px-2 py-0.5 rounded-full bg-yellow-500/20 text-yellow-400 font-bold' }, 'PENDING');
    }

    function FormBadge({ form }) {
      return h('div', { className: 'flex gap-[2px]' },
        form.map((f, i) => h('span', {
          key: i,
          className: `w-3 h-3 rounded-full flex items-center justify-center text-[8px] font-bold ${f === 'W' ? 'bg-[#00C82A] text-black' : f === 'D' ? 'bg-zinc-600 text-white' : 'bg-red-500 text-white'}`
        }, f))
      );
    }

    // Mount to #root
    window.ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>

  <!-- SECRET URL ADMIN SCRIPT (Capacitor search & hash fallback) -->
  <script>
    (function () {
      function checkAdminQuery() {
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        return search.indexOf('admin=true') !== -1 || hash.indexOf('admin=true') !== -1;
      }

      function syncAdminGate() {
        var gate = document.getElementById('adminGate');
        if (!gate) return;
        if (checkAdminQuery()) {
          gate.style.display = 'block';
        } else {
          gate.style.display = 'none';
        }
      }

      window.addEventListener('DOMContentLoaded', syncAdminGate);
      window.addEventListener('load', syncAdminGate);
      window.addEventListener('hashchange', syncAdminGate);
      window.addEventListener('popstate', syncAdminGate);
    })();
  </script>
</body>
</html>
